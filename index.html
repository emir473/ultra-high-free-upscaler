  for(let y=0;y<H;y+=Tz)for(let x=0;x<W;x+=Tz){if(error)throw error;const w=Math.min(Tz,W-x),h=Math.min(Tz,H-y),id=await safe(src,k,x,y,w,h,W,H);for(let r=0;r<h;r++)big.set(id.data.subarray(r*w*4,(r+1)*w*4),((y+r)*W+x)*4);if(captureThis)capRect(cap,id.data,w,x,y,w,h)}
  if(!validFrameAgainstSource(big,W,H,src)){
   const saved=sess;sess=null;try{for(let y=0;y<H;y+=Tz)for(let x=0;x<W;x+=Tz){const w=Math.min(Tz,W-x),h=Math.min(Tz,H-y),id=await safe(src,k,x,y,w,h,W,H);for(let r=0;r<h;r++)big.set(id.data.subarray(r*w*4,(r+1)*w*4),((y+r)*W+x)*4)}}finally{sess=saved}
   if(!validFrameAgainstSource(big,W,H,src))throw Error("Abschlusskontrolle: Ein leerer/schwarzer Frame konnte nicht automatisch repariert werden")
  }
  if(captureThis){cap.got=true;showCmp(src,k,cap)}
  const vf=new VideoFrame(big,{format:"RGBA",codedWidth:W,codedHeight:H,timestamp:ts,duration:du});try{await waitQueue(()=>enc.encodeQueueSize>2,"VideoEncoder")}catch(e){vf.close();throw e}enc.encode(vf,{keyFrame:key||done%(Math.round(fps)*2)===0});vf.close();key=false;done++;sf++;
  prog(done/vs.length*.97,D().cl.replace("{a}",seg).replace("{b}",nseg).replace("{c}",sf.toLocaleString()).replace("{d}",(per[cur]||0).toLocaleString()))
 };
 const pump=(async()=>{try{for(;;){const f=await nextFrame();if(!f)break;await handle(f)}}catch(e){error=error||e;decoderDone=true;wake();frames.forEach(f=>{try{f.close()}catch(_){}});frames.length=0}})();
 try{
  enc.configure(encChoice.config);dec.configure(decodeConfig);
  for(const sample of vs){await waitQueue(()=>frames.length>3||dec.decodeQueueSize>6,"VideoDecoder");if(error)throw error;const bytes=new Uint8Array(await file.slice(sample.offset,sample.offset+sample.size).arrayBuffer());dec.decode(new EncodedVideoChunk({type:sample.is_sync?"key":"delta",timestamp:Math.round(sample.cts*1e6/sample.timescale),duration:Math.round(sample.duration*1e6/sample.timescale),data:bytes}))}
  if(error)throw error;await codecTimeout(dec.flush(),"Decoder-Flush");decoderDone=true;wake();await pump;if(error)throw error;if(done!==vs.length)throw Error(`Decoder lieferte ${done} von ${vs.length} Frames`);
  setStep(6);await codecTimeout(enc.flush(),"Encoder-Abschluss");if(error)throw error;setStep(7);await pushA(Infinity);setStep(8);if(outN!==vs.length)throw Error(`Encoder lieferte ${outN} von ${vs.length} Frames`);setStep(9);mux.finalize();if(storage.error)throw storage.error;
  const blob=storage.blob("video/mp4"),l=D().lb;
  return{blob,name:`upscaled_${W}x${H}.mp4`,expected:{width:W,height:H,audio:useA,fps,duration:m.dur,frames:outN},rep:`${l[0]}: ${W}×${H} (${R()})\n${l[1]}: ${fps.toFixed(2)} (= Original)\n${l[2]}: ${(br/1e6).toFixed(0)} Mbps (Original-Datei: ${(sourceBitrate(m)/1e6).toFixed(1)} Mbps · Empfehlung: ${(recommend/1e6).toFixed(0)} Mbps)\nEncoder: ${encChoice.codec} · ${encChoice.acceleration}\n${l[3]}: ${useA?Math.round(m.abr/1000)+" kbps (AAC-Passthrough, "+at.audio.sample_rate+" Hz)":"Nicht übernommen (Quelle nicht AAC oder keine AAC-Konfiguration)"}\nFrames: ${outN}/${vs.length} ✓\nOffset-Puffer: ${storage.maxEnd.toLocaleString()} Bytes ✓\n${(blob.size/1e6).toFixed(1)} MB`}
 }catch(e){error=error||e;decoderDone=true;wake();try{await pump}catch(_){}frames.forEach(f=>{try{f.close()}catch(_){}});frames.length=0;throw error}
 finally{try{if(dec.state!=="closed")dec.close()}catch(e){}try{if(enc.state!=="closed")enc.close()}catch(e){}fr(src)}
}

async function validatePNG(blob,expected){
 if(!blob||blob.size<45||!blob.stream)throw Error("Abschlussprüfung: PNG-Datei ist leer oder Streams werden nicht unterstützt");
 const reader=blob.stream().getReader();let buffered=new Uint8Array(0),readOffset=0,total=0,seenIHDR=false,seenIDAT=false,seenIEND=false;
 async function exact(n){const out=new Uint8Array(n);let written=0;while(written<n){if(readOffset>=buffered.length){const r=await reader.read();if(r.done)throw Error("Abschlussprüfung: PNG unerwartet abgeschnitten");buffered=r.value instanceof Uint8Array?r.value:new Uint8Array(r.value);readOffset=0}const take=Math.min(n-written,buffered.length-readOffset);out.set(buffered.subarray(readOffset,readOffset+take),written);readOffset+=take;written+=take;total+=take}return out}
 try{
  const sig=await exact(8),expectedSig=[137,80,78,71,13,10,26,10];for(let i=0;i<8;i++)if(sig[i]!==expectedSig[i])throw Error("Abschlussprüfung: PNG-Signatur fehlerhaft");
  while(!seenIEND){const lenBytes=await exact(4),len=new DataView(lenBytes.buffer).getUint32(0),type=await exact(4);if(len>64*1024*1024)throw Error("Abschlussprüfung: PNG-Chunk ist ungewöhnlich groß");const data=await exact(len),crcBytes=await exact(4),stored=new DataView(crcBytes.buffer).getUint32(0),check=new Uint8Array(4+len);check.set(type,0);check.set(data,4);if(crc(check)!==stored)throw Error("Abschlussprüfung: PNG-Chunk-Prüfsumme fehlerhaft");const name=String.fromCharCode(...type);
   if(!seenIHDR){if(name!=="IHDR"||len!==13)throw Error("Abschlussprüfung: PNG-IHDR fehlt");const v=new DataView(data.buffer,data.byteOffset,data.byteLength);if(v.getUint32(0)!==expected.width||v.getUint32(4)!==expected.height||data[8]!==8||data[9]!==2)throw Error("Abschlussprüfung: PNG-Auflösung oder 8-Bit-RGB-Format stimmt nicht");seenIHDR=true}
   else if(name==="IDAT"){seenIDAT=true}
   else if(name==="IEND"){if(len!==0||!seenIDAT)throw Error("Abschlussprüfung: PNG-Ende oder Bilddaten fehlen");seenIEND=true}
   else if(name==="IHDR")throw Error("Abschlussprüfung: Doppelte IHDR-Chunk gefunden");
  }
  if(total!==blob.size||readOffset<buffered.length)throw Error("Abschlussprüfung: Unerwartete Daten nach PNG-IEND");const more=await reader.read();if(!more.done)throw Error("Abschlussprüfung: Zusätzliche Daten nach PNG-IEND");
  return`Alle PNG-Chunks inkl. CRC, IHDR, 8-Bit-RGB, Abmessungen und IEND geprüft ✓ · ${expected.width}×${expected.height}`
 }finally{try{reader.releaseLock()}catch(e){}}
}

async function finish(o){
 if(!o.blob||!o.blob.size)throw Error("Download-Datei ist leer");prog(.985,"Abschlussprüfung (98,5 %): Datei-Integrität, Auflösung, Frames und Ton/Bild-Synchronität …");await sleep(60);
 const quality=o.validate?await o.validate():"Datei-Grundprüfung bestanden ✓";
 if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(o.blob);dlMB=(o.blob.size/1e6).toFixed(1);
 const a=$("dlb");a.href=blobUrl;a.download=o.name;a.target="_self";a.textContent=`${D().dl} (${dlMB} MB)`;
 $("rep").textContent=D().rp+"\n"+o.rep+"\nAbschlussprüfung: "+quality+"\nStatus: BESTANDEN";$("fin").hidden=false;prog(1,"Abschlussprüfung bestanden – Download freigegeben");setStep(10);beep()}
async function start(){
 if(busy||!file||!meta)return;busy=true;$("go").disabled=true;fails=0;$("fin").hidden=true;$("cmp").hidden=true;
 try{ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
 try{if(navigator.wakeLock)wl=await navigator.wakeLock.request("screen")}catch(e){}
 t0=Date.now();note="";prog(0,"");
 try{
  setStep(1);await sleep(150);
  const targetBox=target(meta.w,meta.h),est=mode==="image"?RES[R()][0]*RES[R()][1]*1.5:selectedBitrate(meta,targetBox[0],targetBox[1])*meta.dur/8;
  if(meta.freeB<est&&!confirm(D().mem))throw Error("abgebrochen");
  setStep(2);await sleep(150);setStep(3);
  if(Q()!=="fast"&&!(await loadAI())){note=D().nom;prog(0,"")}
  if(mode==="image"){
   const bmp=await createImageBitmap(file),bw=bmp.width,bh=bmp.height,tg=target(bw,bh),W=tg[0],H=tg[1],k=[W/bw,H/bh],cap=capPlan(W,H);let blob;
   setStep(4);srcVer++;try{blob=await makePNG(bmp,k,W,H,cap);showCmp(bmp,k,cap)}finally{bmp.close()}
   setStep(6);await sleep(60);setStep(7);await sleep(60);setStep(8);await sleep(60);setStep(9);
   const l=D().lb;await finish({blob,name:`upscaled_${W}x${H}.png`,validate:()=>validatePNG(blob,{width:W,height:H}),rep:`${l[0]}: ${W}×${H} (${R()}) ✓\nPNG 8-bit RGB (lossless)\nTile overlap: ${TILE_OVERLAP}px · Feathering + Mean/Std-Matching aktiv\nKacheln neu berechnet / tiles retried: ${fails}\n${(blob.size/1e6).toFixed(1)} MB`})}
  else{setStep(4);const out=await runVideo();await finish({...out,validate:()=>validateMP4(out.blob,out.expected)})}
 }catch(e){console.error(e);stepN=0;$("stp").textContent="⚠ "+(e&&e.message?e.message:e)}
 finally{busy=false;$("go").disabled=false;glDrop();if(wl){try{wl.release()}catch(e){}wl=null}}}

/* Nacht-Dimmer: Overlay max. 90 % (rgba(0,0,0,.90)), Prozentstand mittig, schon das erste Antippen beendet ihn */

$("dim").onclick=()=>$("dim").classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("dim").classList.remove("on")});
let compareDragging=false;
function moveCompare(e){const cw=$("cw"),r=cw.getBoundingClientRect(),pct=Math.max(0,Math.min(100,(e.clientX-r.left)/Math.max(1,r.width)*100));cw.style.setProperty("--split",pct+"%");cw.setAttribute("aria-valuenow",String(Math.round(pct)))}
$("cw").addEventListener("pointerdown",e=>{compareDragging=true;try{$("cw").setPointerCapture(e.pointerId)}catch(_){}moveCompare(e);e.preventDefault()});
$("cw").addEventListener("pointermove",e=>{if(compareDragging)moveCompare(e)});
["pointerup","pointercancel","lostpointercapture"].forEach(type=>$("cw").addEventListener(type,()=>{compareDragging=false}));
$("cw").addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const v=Number($("cw").getAttribute("aria-valuenow"))+(e.key==="ArrowRight"?2:-2),p=Math.max(0,Math.min(100,v));$("cw").style.setProperty("--split",p+"%");$("cw").setAttribute("aria-valuenow",String(p));e.preventDefault()}});
$("sr").onchange=()=>{setStep(stepN);showInfo()};$("sb").onchange=showInfo;
tr();setMode("video");
