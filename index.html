async function validatePNG(blob,expected){
 if(!blob||blob.size<45||!blob.stream)throw Error("Abschlussprüfung: PNG-Datei ist leer oder Streams werden nicht unterstützt");
 const reader=blob.stream().getReader();let buffered=new Uint8Array(0),readOffset=0,total=0,seenIHDR=false,seenIDAT=false,seenIEND=false;
 async function exact(n){const out=new Uint8Array(n);let written=0;while(written<n){if(readOffset>=buffered.length){const r=await reader.read();if(r.done)throw Error("Abschlussprüfung: PNG unerwartet abgeschnitten");buffered=r.value instanceof Uint8Array?r.value:new Uint8Array(r.value);readOffset=0}const take=Math.min(n-written,buffered.length-readOffset);out.set(buffered.subarray(readOffset,readOffset+take),written);readOffset+=take;written+=take;total+=take}return out}
 try{
  const sig=await exact(8),expectedSig=[137,80,78,71,13,10,26,10];for(let i=0;i<8;i++)if(sig[i]!==expectedSig[i])throw Error("Abschlussprüfung: PNG-Signatur fehlerhaft");
  while(!seenIEND){const lenBytes=await exact(4),len=new DataView(lenBytes.buffer).getUint32(0),type=await exact(4);if(len>64*1024*1024)throw Error("Abschlussprüfung: PNG-Chunk ist ungewöhnlich groß");const data=await exact(len),crcBytes=await exact(4),stored=new DataView(crcBytes.buffer).getUint32(0),check=new Uint8Array(4+len);check.set(type,0);check.set(data,4);if(crc(check)!==stored)throw Error("Abschlussprüfung: PNG-Chunk-Prüfsumme fehlerhaft");const name=String.fromCharCode(...type);
   if(!seenIHDR){if(name!=="IHDR"||len!==13)throw Error("Abschlussprüfung: PNG-IHDR fehlt");const v=new DataView(data.buffer,data.byteOffset,data.byteLength);if(v.getUint32(0)!==expected.width||v.getUint32(4)!==expected.height||data[8]!==8||data[9]!==2)throw Error("Abschlussprüfung: PNG-Auflösung oder 8-Bit-RGB-Format stimmt nicht");seenIHDR=true}
   else if(name==="IDAT"){seenIDAT=true}
   else if(name==="IEND"){if(len!==0||!seenIDAT)throw Error("Abschlussprüfung: PNG-Ende oder Bilddaten fehlen");seenIEND=true}
   else if(name==="IHDR")throw Error("Abschlussprüfung: Doppelte IHDR-Chunk gefunden");
  }
  if(total!==blob.size||readOffset<buffered.length)throw Error("Abschlussprüfung: Unerwartete Daten nach PNG-IEND");const more=await reader.read();if(!more.done)throw Error("Abschlussprüfung: Zusätzliche Daten nach PNG-IEND");
  return em("pv",expected.width,expected.height)
 }finally{try{reader.releaseLock()}catch(e){}}
}
