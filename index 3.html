function timeToUs(ticks,timescale,label,allowNegative=true){
 const t=Number(ticks),scale=Number(timescale);
 if(!Number.isFinite(t)||!Number.isFinite(scale)||scale<=0)throw Error(`${label}: ungültige Zeitbasis`);

}

  else{setStep(4);const out=await runVideo();await finish({...out,validate:()=>validateMP4(out.blob,out.expected)})}
 }catch(e){console.error(e);stepN=0;$("stp").textContent="⚠ "+(e&&e.message?e.message:e)}
 finally{busy=false;$("go").disabled=false;["sq","sr","sb","lg","bv","bi","fi"].forEach(id=>{const el=$(id);if(el)el.disabled=false});glDrop();if(wl){try{wl.release()}catch(e){}wl=null}}}

/* ---------- Events ---------- */
$("lg").onchange=e=>{lang=e.target.value;tr()};
$("bv").onclick=()=>setMode("video");$("bi").onclick=()=>setMode("image");
$("fi").onchange=e=>{if(e.target.files[0])analyze(e.target.files[0])};
["dragover","drop"].forEach(n=>$("dz").addEventListener(n,e=>{e.preventDefault();if(n==="drop"&&e.dataTransfer.files[0])analyze(e.dataTransfer.files[0])}));
$("go").onclick=start;
/* Nacht-Dimmer: Overlay max. 90 % (rgba(0,0,0,.90)), Prozentstand mittig, schon das erste Antippen beendet ihn */
$("dm").onclick=()=>{$("dpc").textContent=$("pc").textContent;$("dim").classList.add("on")};
$("dim").onclick=()=>$("dim").classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("dim").classList.remove("on")});
let compareDragging=false;
function moveCompare(e){const cw=$("cw"),r=cw.getBoundingClientRect(),pct=Math.max(0,Math.min(100,(e.clientX-r.left)/Math.max(1,r.width)*100));cw.style.setProperty("--split",pct+"%");cw.setAttribute("aria-valuenow",String(Math.round(pct)))}
$("cw").addEventListener("pointerdown",e=>{compareDragging=true;try{$("cw").setPointerCapture(e.pointerId)}catch(_){}moveCompare(e);e.preventDefault()});
$("cw").addEventListener("pointermove",e=>{if(compareDragging)moveCompare(e)});
["pointerup","pointercancel","lostpointercapture"].forEach(type=>$("cw").addEventListener(type,()=>{compareDragging=false}));
$("cw").addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const v=Number($("cw").getAttribute("aria-valuenow"))+(e.key==="ArrowRight"?2:-2),p=Math.max(0,Math.min(100,v));$("cw").style.setProperty("--split",p+"%");$("cw").setAttribute("aria-valuenow",String(p));e.preventDefault()}});
$("sr").onchange=()=>{setStep(stepN);showInfo()};$("sb").onchange=showInfo;
tr();setMode("video");
</script>
</body>
</html>
